name: release

# Push a tag such as v0.1.0 to publish quantumnovice/gpu-governor:0.1.0 for
# amd64 and arm64. The Docker Extensions Marketplace requires both platforms
# and a semver tag.
#
# Repository settings needed:
#   secrets.DOCKERHUB_USERNAME  Docker Hub user
#   secrets.DOCKERHUB_TOKEN     Docker Hub access token with read/write scope
#   vars.DOCKERHUB_IMAGE        optional, defaults to quantumnovice/gpu-governor

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'quantumnovice/gpu-governor' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Install: \`docker extension install ${IMAGE}:${{ steps.version.outputs.value }}\`"
